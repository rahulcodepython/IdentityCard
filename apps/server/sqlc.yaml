version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/sqlc/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/sqlc/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
