name: identitycard

services:
    postgres:
        image: ${POSTGRES_IMAGE:-postgres:17-alpine}
        container_name: ${POSTGRES_CONTAINER_NAME:-identitycard-postgres}
        env_file:
            - path: .env
              required: false
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-identitycard}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identitycard}
            POSTGRES_DB: ${POSTGRES_DB:-identitycard}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U identitycard -d identitycard"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    migrate:
        image: ${MIGRATE_IMAGE:-migrate/migrate:v4.19.1}
        container_name: ${MIGRATE_CONTAINER_NAME:-identitycard-migrate}
        env_file:
            - path: .env
              required: false
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ../apps/server/internal/db/migrations:/migrations:ro
        command:
            - "-path=/migrations"
            - "-database=postgres://${POSTGRES_USER:-identitycard}:${POSTGRES_PASSWORD:-identitycard}@postgres:5432/${POSTGRES_DB:-identitycard}?sslmode=disable"
            - "up"


    redis:
        image: ${REDIS_IMAGE:-redis:7-alpine}
        container_name: ${REDIS_CONTAINER_NAME:-identitycard-redis}
        env_file:
            - path: .env
              required: false
        ports:
            - "${REDIS_PORT:-6379}:6379"
        restart: unless-stopped
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    minio:
        image: ${MINIO_IMAGE:-minio/minio:latest}
        container_name: ${MINIO_CONTAINER_NAME:-identitycard-minio}
        env_file:
            - path: .env
              required: false
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - "${MINIO_API_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        restart: unless-stopped
        volumes:
            - miniodata:/data
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    mailhog:
        image: ${MAILHOG_IMAGE:-mailhog/mailhog:latest}
        container_name: ${MAILHOG_CONTAINER_NAME:-identitycard-mailhog}
        env_file:
            - path: .env
              required: false
        ports:
            - "${MAILHOG_SMTP_PORT:-1025}:1025"
            - "${MAILHOG_WEB_PORT:-8025}:8025"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://localhost:8025/ || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    whodb:
        image: ${WHODB_IMAGE:-clidey/whodb:latest}
        container_name: ${WHODB_CONTAINER_NAME:-identitycard-whodb}
        env_file:
            - path: .env
              required: false
        ports:
            - "${WHODB_PORT:-8085}:8080"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

volumes:
    pgdata:
    redisdata:
    miniodata:
